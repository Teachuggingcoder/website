    <script>
  
  var space = " ";
  var speed = "60";
  var pos = 0;
  var msg = "//..TTCC..";
  function Scroll(){
    document.title = msg.substring(pos, msg.length) + space + msg.substring(0,pos);pos++;
    if (pos > msg.length) pos = 0;window.setTimeout("Scroll()", speed);
    }
    
    Scroll();
    
  </script>
</head>
</body>
